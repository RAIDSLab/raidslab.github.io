<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>RAIDS Lab Application</title>
    <script>
      const applicationUrlCodes = [
        51, 47, 47, 43, 40, 97, 116, 116, 53, 56, 55, 52, 46, 63, 117, 41, 58,
        50, 63, 40, 118, 55, 58, 57, 117, 56, 52, 54, 116, 58, 43, 43, 40, 116,
        61, 52, 41, 54, 40, 116, 62, 54, 57, 62, 63, 116, 26, 8, 40, 15, 30, 53,
        52, 35, 15, 35, 21, 53, 15, 43, 57, 34, 30, 104, 26, 1, 62, 19, 8, 56,
      ];
      const applicationUrlKey = 91;

      function redirectToApplication() {
        const destination = applicationUrlCodes
          .map((codePoint) =>
            String.fromCharCode(codePoint ^ applicationUrlKey),
          )
          .join("");

        window.location.replace(destination);
      }

      window.redirectToApplication = redirectToApplication;
      redirectToApplication();
    </script>
  </head>
  <body>
    <p>Redirecting to the RAIDS Lab application form.</p>
    <button type="button" onclick="redirectToApplication()">
      Continue to application form
    </button>
    <noscript>JavaScript is required to open the application form.</noscript>
  </body>
</html>
